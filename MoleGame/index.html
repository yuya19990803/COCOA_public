<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COCOA モグラたたき</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


   <div id="start-screen">

    <h2>COCOA モグラたたき</h2>

    <p id="game-description">
        制限時間は 30秒です。<br>
        モグラを たくさん たたきましょう！
    </p>

    <button id="start-btn">
    スタート
</button>

<p class="notice-title">
    COCOAのモグラたたきゲームへようこそ！
</p>

<p class="notice">
    COCOAはゲーム感覚で楽しみながら高次脳機能のトレーニングが出来ることを目指しています。
</p>

<p class="notice">
    高次脳機能の改善が保証されるものではありませんのでご了承ください。
</p>

<p class="notice">
    このゲームは開発段階のため、
    内容や仕様は予告なく変更することがあります。
</p>

<div id="countdown"></div>

</div>

    <div class="header">
        <h1>COCOA モグラたたき</h1>
        <div id="score">Score : 0</div>
        <div id="timer">残り時間 : 30</div>
    </div>

    <div id="game-board"></div>

    <div id="game-over" class="hidden">

    <p id="rank-message">
        あなたは
    </p>

    <h2 id="rank-name">
        初心者モグラハンター
    </h2>

    <img
        id="rank-image"
        src="images/初心者モグラハンター.png"
        alt="ランク画像">

    <button id="restart-btn">
       ☕もう一回あそぶ
   </button>

</div>

    <script src="script.js"></script>

    <img id="cocoa-logo"
         src="images/COCOA_LOGO_1.png"
            alt="COCOAロゴ">
            
            
</body>
</html>
